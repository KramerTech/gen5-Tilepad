# An example package page (docs/TWEAKS.md, "Pages from other packages"), with every kind of
# control. A package installs it as /data/nemesis/apps/<id>/tilepad.properties, beside its own
# bin/ctl.sh, which saves persist.exa.<key> for "set" and answers "req" in exa.res.
schema=1
title=Example Package Page
results=exa.res
palette.basic=00B4FF,FF7D73,7A34FF,77FEC4
palette.basic.names=Ice Blue,Warm Coral,Indigo,Mint
help=A package page with every kind of control. Its five modes have no layout, so Tilepad decides from the labels' widths.

status.1.when=exa.gate = fail
status.1.problem=1
status.1.text=This example isn't supported on this firmware, so nothing it shows is sent anywhere at all.
status.2.when=exa.state in active,dimmed
status.2.text=Active: {exa.mode|morning=Morning,daytime=Daytime,evening=Evening,weather=Weather,climate=Climate,*=Active} · {exa.detail}
status.3.when=persist.exa.on = 1 and exa.state = paused
status.3.text=Paused ({exa.why|call=phone call,drive=parked only,*=waiting}); your saved setting ({exa.saved}) is kept.
status.4.when=exa.err set
status.4.problem=1
status.4.text=Note: {exa.err}

control.1.type=toggle
control.1.prop=persist.exa.on
control.1.label=Example Switch With a Fairly Long Label
control.1.default=0

control.2.type=choices
control.2.prop=persist.exa.mode
control.2.default=morning
control.2.when=persist.exa.on = 1
control.2.option.1=morning|Morning|Follows the morning.
control.2.option.2=daytime|Daytime|Follows the day.
control.2.option.3=evening|Evening|Follows the evening.
control.2.option.4=weather|Weather|Follows the weather.
control.2.option.5=climate|Climate|Follows the climate.

control.3.type=choices
control.3.prop=persist.exa.lift
control.3.label=Louder at Speed
control.3.default=1
control.3.layout=horizontal
control.3.option.1=0|Off
control.3.option.2=1|Low
control.3.option.3=2|Medium

control.4.type=heading
control.4.label=Colors and Levels
control.4.when=persist.exa.on = 1

control.5.type=color
control.5.prop=persist.exa.col
control.5.label=Cold Weather Color
control.5.default=00B4FF
control.5.palette=basic
control.5.when=persist.exa.on = 1

control.6.type=stepper
control.6.prop=persist.exa.lv
control.6.label=Brightness
control.6.min=0
control.6.max=10
control.6.default=7
control.6.zero=Off
control.6.of=10
control.6.when=persist.exa.on = 1

control.7.type=temperature
control.7.prop=persist.exa.cold
control.7.label=Cold Below
control.7.min=-30
control.7.max=40
control.7.default=5.0
control.7.when=persist.exa.on = 1

control.8.type=note
control.8.text=Current reading: {exa.detail|none=Waiting for car data}

control.9.type=action
control.9.label=Restore My Setting
control.9.request=restore
control.9.confirm.title=Restore My Setting?
control.9.confirm.text=Puts back your saved setting and turns the example off.
control.9.result.restored=Restored.
control.9.result.failed=Couldn't restore right now.
control.9.timeout=20
