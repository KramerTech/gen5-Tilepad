# Steering-wheel star (custom) trigger, verified on this car (Ioniq 5, NEEV23 US) on 2026-10-31:
# pressing the star emits EV_KEY code 43 (0x2b, SHORTCUT_SWRC_CUSTOM) values 1/0 on this
# input device. DEVICE_NAME is matched against "N: Name=..." in /proc/bus/input/devices.
DEVICE_NAME=daudio_wp_daudioplus_neev23_us
KEY_CODE=43
# How long the star must be held before the target opens (Hyundai's own long-press is 800 ms).
# Stock runs the star's assigned action only on a short release, so a hold doesn't also run it.
HOLD_MS=800
# Open Tilepad, registered as /system/app/Tilepad.apk.
TARGET_COMPONENT=com.tilepad/.MainActivity
